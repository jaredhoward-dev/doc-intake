name: Security

# Static analysis (SAST) of our own code via CodeQL, adapted from media-intake. The engine has no
# third-party dependencies, so there is no dependency audit beside it; CodeQL looks at the code we
# write (path handling, subprocess calls, unsafe deserialisation, logging of values, etc.) and, as a
# separate language, at workflow-injection sinks in the GitHub Actions YAML. Results land in the
# repo's Security tab under "Code scanning alerts".
#
# Triggers:
#   - pull_request to main: gate new code on a clean scan
#   - push to main: scan post-merge state, refresh the Security-tab baseline
#   - weekly cron (Sunday 06:00 UTC): catch new CodeQL queries flagging existing code without
#     waiting for a PR; a day before scorecard (Monday 06:00 UTC) so they don't compete for runners.
#   - workflow_dispatch: ad-hoc manual runs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  # Workflow-level grouping cancels both matrix legs together when a new
  # commit lands on the same ref — that's the desired behaviour
  # (no point analysing the stale SHA). `matrix.language` can't be
  # referenced at workflow level (job context only), and per-language
  # grouping isn't worth the complexity here.
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level permission is the least-privilege baseline; the analyze
# job below requests the additional scopes it actually needs. Per
# Scorecard Token-Permissions guidance: prefer per-job permission blocks
# over a single elevated top-level set.
permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # SARIF upload requires `security-events: write` for the
      # analyze step to publish findings into the Security tab.
      security-events: write
      # `actions: read` is needed by the analyze step's workflow-run
      # lookup (without it the action errors with "Resource not
      # accessible by integration" even when analysis itself succeeded).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # python covers doc_intake/ and tests/ (build-mode: none, no autobuilder).
        # actions covers every workflow under .github/workflows/ (workflow
        # injection, unpinned actions and other GHA-specific sinks).
        language: [actions, python]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CodeQL reads the tree only; the upload uses its own token input.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No compile step — both languages are interpreted. Skips the
          # autobuild tracer and shaves a few minutes off each run.
          build-mode: none
          # security-and-quality is the broadest of the three suites
          # (security < security-extended < security-and-quality). For a
          # small codebase the extra noise is manageable and the
          # maintainability/correctness queries are useful. The `actions`
          # language only ships a `security-extended` ceiling; CodeQL
          # silently falls back to that when security-and-quality isn't
          # available — no per-language branching required.
          queries: security-and-quality

      - name: Perform analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
