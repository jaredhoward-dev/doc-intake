# Unit tests on synthetic documents only. Python comes from Ubuntu's apt
# packages (stdlib only: no pip, no unpinned downloads); poppler-utils and
# tesseract are the optional system tools the reader uses. `CI gate` is the
# single check to require on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr
      - name: Unit tests
        run: python3 -I -m unittest discover -s tests -t . -v

  gate:
    name: CI gate
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every job passed
        env:
          TEST: ${{ needs.test.result }}
        run: test "$TEST" = success
